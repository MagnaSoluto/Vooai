# VooAI na box FourDev — imagens ECR; rede sdr-box_default (Caddy).
# Redis na mesma box: cache de cotações (sem Kafka). Fila futura = Redis lists/RQ.
name: vooai-box

services:
  vooai-redis:
    image: redis:7-alpine
    container_name: vooai-redis
    restart: unless-stopped
    mem_limit: 128m
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    networks:
      - sdr-box_default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  vooai-api:
    image: ${VOOAI_API_IMAGE}
    container_name: vooai-api
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - /opt/vooai/api.env
    environment:
      VOOAI_DATA_DIR: /data
      VOOAI_SPEC_DIR: /data/Spec
      REDIS_URL: redis://vooai-redis:6379/0
      VOOAI_QUOTE_CACHE_TTL_SEC: "1200"
      # VOOAI_DATABASE_URL e billing vêm de /opt/vooai/api.env
    depends_on:
      vooai-redis:
        condition: service_healthy
    networks:
      - sdr-box_default
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  vooai-web:
    image: ${VOOAI_WEB_IMAGE}
    container_name: vooai-web
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      vooai-api:
        condition: service_healthy
    networks:
      - sdr-box_default

networks:
  sdr-box_default:
    external: true
