# Assets com hash no nome podem ter cache longo; index.html nunca (sempre pega o build novo).
map $uri $vooai_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # CSP estrita: sem script inline, sem eval e sem script de terceiros (o app não usa).
    # Se o AdSense for ligado (VITE_ADSENSE_*), liberar os domínios do Google em
    # script-src/frame-src/img-src/connect-src — de preferência com nonce + 'strict-dynamic'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $vooai_cache_control always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
